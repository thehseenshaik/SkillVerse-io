<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      window.global = window;
      window.process = window.process || {
        env: { NODE_ENV: "production" },
        browser: true,
        version: "",
        versions: { node: false },
        nextTick: function (fn) { setTimeout(fn, 0); }
      };
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SkillVerse — Your Complete Career Operating System</title>
    <meta
      name="description"
      content="SkillVerse is an AI-powered Career OS that unifies LinkedIn, GitHub, LeetCode, resumes, courses and interviews into one dashboard."
    />
    <meta name="application-name" content="SkillVerse" />
    <meta name="theme-color" content="#ff5533" />
    <link rel="icon" type="image/svg+xml" href="/favicon-32x32.svg" />
    <link rel="icon" type="image/svg+xml" href="/favicon-16x16.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Roboto:wght@300;400;500;700&family=Poppins:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Lato:ital,wght@0,300;0,400;0,700;1,400&family=JetBrains+Mono:wght@400;500;700&family=Merriweather:ital,wght@0,300;0,400;0,700;1,400&family=Open+Sans:wght@300;400;600;700&family=Source+Sans+3:wght@300;400;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/styles.css" />
    <script>
      try {
        var t = localStorage.getItem("sv-theme");
        var m = window.matchMedia("(prefers-color-scheme: dark)").matches;
        if (t === "dark" || (!t && m)) {
          document.documentElement.classList.add("dark");
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/client.tsx"></script>
  </body>
</html>
